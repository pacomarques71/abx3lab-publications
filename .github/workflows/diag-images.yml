name: Diag images (temporal)
on:
  push:
    branches: [diag-image]
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install "requests>=2.31,<3" "beautifulsoup4>=4.12,<5" "Pillow>=10.4,<13" "PyMuPDF>=1.24,<2"
      - run: python .diag/diag2.py
      - uses: actions/upload-artifact@v4
        with: {name: pdfs, path: diag_out, retention-days: 1}
