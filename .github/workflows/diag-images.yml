name: Diag images (temporal)
on:
  push:
    branches: [diag-image]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
      WILEY_TDM_TOKEN: ${{ secrets.WILEY_TDM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install "requests>=2.31,<3" "beautifulsoup4>=4.12,<5" "Pillow>=10.4,<13" "PyMuPDF>=1.24,<2"
      - run: python -m unittest discover -s tests
      - run: python scripts/enrich_publications.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data images
          git commit -m "diag: resultado del enriquecimiento [skip ci]" || true
          git push
