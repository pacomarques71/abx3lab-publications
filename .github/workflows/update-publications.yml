name: Update publications

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  # Al editar los datos editoriales o el script, se regenera al momento.
  push:
    branches: [main]
    paths:
      - "data/publication_extras.json"
      - "data/projects.json"
      - "data/publication_team.json"
      - "data/excluded_publications.json"
      - "scripts/update_publications.py"
      - "scripts/enrich_publications.py"
      - ".github/workflows/update-publications.yml"
      - "tests/test_publication_enrichment.py"

concurrency:
  group: update-publications-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest

    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
      WILEY_TDM_TOKEN: ${{ secrets.WILEY_TDM_TOKEN }}
      CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install enrichment dependencies
        run: python -m pip install "requests>=2.31,<3" "beautifulsoup4>=4.12,<5" "Pillow>=10.4,<13" "PyMuPDF>=1.24,<2"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Update publications
        run: |
          set +e
          python scripts/update_publications.py
          status=$?
          set -e
          if [ "$status" -eq 75 ]; then
            echo "::warning title=OpenAlex rate limited::HTTP 429 al actualizar artículos. Conservando JSON existentes y continuando la recuperación de imágenes."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Enrich funding evidence and licensed article images
        run: python scripts/enrich_publications.py

      - name: Commit changes if needed
        run: |
          git add data/publications.json data/publications_2025.json data/publication_evidence.json
          if [ -d images ]; then git add images/; fi
          if git diff --cached --quiet; then
            echo "No publication changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update publications"
          if ! git push; then
            # Another editor may have updated a different file while this run worked.
            # Retry a normal rebase once; never force-push or discard conflicts.
            git fetch origin main
            git rebase origin/main
            git push
          fi
